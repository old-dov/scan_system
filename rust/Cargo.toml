[workspace]
resolver = "2"
members = ["crates/scan-system-core", "crates/scan-system-platform", "crates/scan-system-sysmon", "crates/scan-system-audit", "crates/scan-system-cli", "crates/scan-system-gui"]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
scan-system-core = { path = "crates/scan-system-core" }
